# Backup for /api/keepalive: pings Supabase every 3 days so the free project never pauses.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
name: Supabase keep-alive
on:
  schedule: [{ cron: "23 7 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the keepalive table
        env: { URL: "${{ secrets.SUPABASE_URL }}", KEY: "${{ secrets.SUPABASE_ANON_KEY }}" }
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets not set; skipping."; exit 0; fi
          curl -fsS "$URL/rest/v1/keepalive?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || curl -fsS "$URL/rest/v1/" -H "apikey: $KEY" -o /dev/null
